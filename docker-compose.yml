services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-demo}
      VITE_DEMO_FALLBACK: "true"
      VITE_KEYCLOAK_CLIENT_ID: droplet-frontend
      VITE_KEYCLOAK_REALM: droplet
      VITE_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AUTH_MODE: ${AUTH_MODE:-demo}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CLIMATE_SOURCE_TIMEOUT_SECONDS: "8"
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://droplet:droplet@postgres:5432/droplet
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      KEYCLOAK_CLIENT_ID: droplet-frontend
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: droplet
      KEYCLOAK_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379/0
      DEMO_HISTORY_DAYS: "365"
      SNAPSHOT_RETENTION_DAYS: "395"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CLIMATE_SOURCE_TIMEOUT_SECONDS: "8"
      DATABASE_URL: postgresql+psycopg://droplet:droplet@postgres:5432/droplet
      REDIS_URL: redis://redis:6379/0
      SNAPSHOT_RETENTION_DAYS: "395"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.workers.celery_app.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CLIMATE_CONTEXT_REFRESH_INTERVAL_MINUTES: "30"
      SNAPSHOT_REFRESH_INTERVAL_MINUTES: "30"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: droplet
      POSTGRES_PASSWORD: droplet
      POSTGRES_USER: droplet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droplet -d droplet"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres_data:
  redis_data:
